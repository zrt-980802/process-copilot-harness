server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  resolver 127.0.0.11 valid=1s ipv6=off;
  set $pc_backend http://pc-api:3000;
  set $ee_backend http://ee-api:5000;
  location ~ ^/api/ee-auth/(login|me|logout|process-copilot/launch)$ {
    rewrite ^/api/ee-auth/(.*)$ /api/v1/auth/$1 break;
    proxy_set_header Host $http_host;
    proxy_pass $ee_backend;
    add_header Cache-Control no-store always;
  }
  location ~ ^/api/(health$|ready$|v1/(workbench(/|$)|ssts-tasks(/|$)|providers/eeclaw/retry$|pilot/sign-in$|identity/me$|auth/(ee/exchange|logout)$|resources/uploads$)) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_pass $pc_backend;
    proxy_read_timeout 650s;
    proxy_buffering off;
  }
  location /api/ { return 403; }
  location / { try_files $uri $uri/ /index.html; }
}
