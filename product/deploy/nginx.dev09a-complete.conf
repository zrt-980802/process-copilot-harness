server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  location ~ ^/api/(v1/(workbench(/|$)|ssts-tasks(/|$)|pilot/sign-in$|identity/me$|resources/uploads$)|ready$|health$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://verifier:3000;
    proxy_read_timeout 650s;
    proxy_buffering off;
  }
  location /api/ { return 403; }
  location / { try_files $uri $uri/ /index.html; }
}
