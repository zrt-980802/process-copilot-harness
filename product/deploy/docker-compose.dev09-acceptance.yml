name: process-copilot-dev09-acceptance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: process_copilot
      POSTGRES_USER: process_copilot
      POSTGRES_PASSWORD: process_copilot_local
    volumes:
      - authority-data:/var/lib/postgresql/data
    networks:
      - control
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U process_copilot -d process_copilot
      interval: 2s
      timeout: 2s
      retries: 30

  resource-init:
    image: process-copilot-dev09-acceptance-api:${PC_BUILD_TAG:-dev}
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p
        /var/lib/process-copilot/blobs
        /var/lib/process-copilot/materializations
        && chown -R node:node /var/lib/process-copilot
    volumes:
      - blob-data:/var/lib/process-copilot/blobs
      - materialization-data:/var/lib/process-copilot/materializations
    networks:
      - control
    restart: "no"

  pc-api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: process-copilot-dev09-acceptance-api:${PC_BUILD_TAG:-dev}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PC_RUNTIME_REGISTRY_STORE: postgres
      PC_IDENTITY_STORE: postgres
      PC_PROFILE_STORE: postgres
      PC_RESOURCE_STORE: postgres
      PC_EVENT_STORE: postgres
      PC_SSTS_STORE: postgres
      PC_EVENT_INGEST_SECRET: local-acceptance-event-ingest-secret-000000
      PC_BLOB_ROOT: /var/lib/process-copilot/blobs
      PC_MATERIALIZATION_ROOT: /var/lib/process-copilot/materializations
      PC_ENVELOPE_SIGNING_KEY: local-acceptance-signing-key-0000000000000000
      PC_PILOT_TENANT_ID: tenant_acceptance
      PC_PILOT_ACCOUNT_KEY: pilot.acceptance
      PC_PILOT_ACCOUNT_SECRET: LocalAcceptanceSecret123
      DATABASE_URL: postgres://process_copilot:process_copilot_local@postgres:5432/process_copilot
    volumes:
      - blob-data:/var/lib/process-copilot/blobs
      - materialization-data:/var/lib/process-copilot/materializations
    depends_on:
      postgres:
        condition: service_healthy
      resource-init:
        condition: service_completed_successfully
    networks:
      - control
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(r=>r.json()).then(x=>{if(x.status!=='ready'||x.dependencies.ssts_draft!=='ready')process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 2s
      start_period: 10s
      retries: 30

  pc-web:
    build:
      context: ..
      dockerfile: deploy/web-acceptance.Dockerfile
    image: process-copilot-dev09-acceptance-web:${PC_BUILD_TAG:-dev}
    ports:
      - "127.0.0.1:18090:80"
    depends_on:
      pc-api:
        condition: service_healthy
    networks:
      - control
      - edge
    restart: "no"

networks:
  control:
    internal: true
  edge:
    driver: bridge

volumes:
  authority-data:
  blob-data:
  materialization-data:
