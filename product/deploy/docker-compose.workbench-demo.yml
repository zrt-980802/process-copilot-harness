name: pc-workbench-demo
x-ee: &ee
  PC_LOCAL_DEMO: "1"
  PYTHON_DOTENV_DISABLED: "1"
  PYTHONPATH: /ee/backend:/ee/apps/process-copilot-mcp-adapter
  MYSQL_HOST: ee-mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: ee_demo
  MYSQL_PASSWORD: local-ee-demo-only
  MYSQL_DATABASE: ee_pc_demo
  MYSQL_CHARSET: utf8mb4
  PROCESS_COPILOT_ADAPTER_SECRET: local-workbench-ee-service-secret
  PROCESS_COPILOT_API_URL: http://pc-api:3000
  FEISHU_APP_ID: local-demo-no-bot
  FEISHU_APP_SECRET: local-demo-no-bot
  FEISHU_VERIFICATION_TOKEN: local-demo-no-bot
x-pc: &pc
  PC_LOCAL_DEMO: "1"
  HOST: 0.0.0.0
  PC_LOGIN_MODE: ee
  DATABASE_URL: postgres://pc_demo:local-pc-demo-only@pc-postgres:5432/pc_demo
  PC_RUNTIME_REGISTRY_STORE: postgres
  PC_IDENTITY_STORE: postgres
  PC_PROFILE_STORE: postgres
  PC_RESOURCE_STORE: postgres
  PC_GATEWAY_STORE: postgres
  PC_EVENT_STORE: postgres
  PC_SSTS_STORE: postgres
  PC_GATEWAY_PROVIDER: ee_mcp
  PC_BLOB_ROOT: /data/blobs
  PC_MATERIALIZATION_ROOT: /data/workspaces
  PC_ENVELOPE_SIGNING_KEY: local-workbench-signing-key-000000000000
  PC_RUNTIME_SERVICE_SECRET: local-workbench-runtime-secret-0000000
  PC_EVENT_INGEST_SECRET: local-workbench-event-secret-000000000
  PC_PILOT_TENANT_ID: tenant_acceptance
  PC_PILOT_ACCOUNT_KEY: pilot.acceptance
  PC_PILOT_ACCOUNT_SECRET: LocalAcceptanceSecret123
  EECLAW_ADAPTER_URL: http://ee-api:5000
  EECLAW_ADAPTER_SECRET: local-workbench-ee-service-secret
  EE_MCP_ADAPTER_URL: http://ee-mcp-adapter:5011/mcp
  EE_MCP_ADAPTER_SECRET: local-workbench-mcp-service-secret
  PC_WORKBENCH_RUNTIME_URL: http://pc-runtime:3100
  PC_USER_RUNTIME_MANAGER_URL: http://user-runtime-manager:3200
services:
  ee-mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: local-demo-root-only
      MYSQL_DATABASE: ee_pc_demo
      MYSQL_USER: ee_demo
      MYSQL_PASSWORD: local-ee-demo-only
    volumes: [ee-mysql-data:/var/lib/mysql]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 3s
      timeout: 3s
      retries: 50
    restart: unless-stopped
  pc-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pc_demo
      POSTGRES_USER: pc_demo
      POSTGRES_PASSWORD: local-pc-demo-only
    volumes: [pc-postgres-data:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pc_demo -d pc_demo]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  ee-api:
    image: process-copilot-workbench-demo:local
    build: {context: .., dockerfile: deploy/workbench-demo.Dockerfile}
    command: [python, -m, ee_mcp_adapter.demo]
    environment: *ee
    volumes: ["${PC_DEMO_EE_ROOT:?Set isolated EE root}:/ee:ro", demo-bootstrap:/demo-bootstrap]
    networks: [control]
    depends_on:
      ee-mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 5s
      timeout: 4s
      retries: 50
      start_period: 30s
    restart: unless-stopped
  ee-mcp-adapter:
    image: process-copilot-workbench-demo:local
    command: [python, -m, ee_mcp_adapter]
    environment:
      <<: *ee
      EE_MCP_HOST: 0.0.0.0
      EE_MCP_PORT: "5011"
      EE_MCP_SERVICE_VERSION: 0.2.0-local-demo
      EE_APP_BASE_URL: http://ee-api:5000
      EE_MCP_ADAPTER_SECRET: local-workbench-mcp-service-secret
    volumes: ["${PC_DEMO_EE_ROOT}:/ee:ro"]
    networks: [control]
    depends_on:
      ee-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5011/health')"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  pc-api:
    image: process-copilot-workbench-demo:local
    command: [python, start-pc-demo.py, main.mjs]
    environment:
      <<: *pc
      PORT: "3000"
    volumes: [pc-data:/data, demo-bootstrap:/demo-bootstrap:ro]
    networks: [control]
    depends_on:
      ee-mcp-adapter: {condition: service_healthy}
      pc-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  pc-runtime:
    image: process-copilot-workbench-demo:local
    command: [node, runtime.mjs]
    environment:
      <<: *pc
      PORT: "3100"
      PC_RUNTIME_ID: pc-workbench-demo-runtime
      PC_RUNTIME_EPOCH: "1"
      PC_RUNTIME_STATE_ROOT: /runtime-state/host
      PC_RUNTIME_WORKSPACE: /runtime-state/workspace
      DSH_HOME: /runtime-state/home
      DSH_BIN: /usr/local/bin/dsh-source
      DSH_BRIDGE_COMMAND: python
      DSH_PYTHON_BRIDGE: /app/python/dsh_runtime_bridge.py
      DSH_PROVIDER: deepseek-official
      DSH_MODEL: ${PC_DEV09A_MODEL:-deepseek-v4.1-flash}
      DSH_REQUEST_TIMEOUT_MS: "600000"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Use start-workbench-demo.py}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      PC_RUNTIME_TOOL_URL: http://pc-api:3000/v1/internal/runtime-tools/execute
      PC_EVENT_INGEST_URL: http://pc-api:3000/v1/events/ingest
    volumes: [pc-data:/data, runtime-data:/runtime-state]
    networks: [control, model]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  user-runtime-manager:
    image: process-copilot-workbench-demo:local
    command: [python, user-runtime-manager.py]
    environment:
      PC_LOCAL_DEMO: "1"
      PC_RUNTIME_TENANT: tenant_acceptance
      PC_RUNTIME_SERVICE_SECRET: local-workbench-runtime-secret-0000000
    volumes: [/var/run/docker.sock:/var/run/docker.sock, pc-data:/pc-data]
    networks: [control]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3200/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  seed:
    image: process-copilot-workbench-demo:local
    command: [python, start-pc-demo.py, seed.mjs]
    environment: *pc
    volumes: [pc-data:/data, demo-bootstrap:/demo-bootstrap:ro]
    networks: [control]
    depends_on:
      pc-api: {condition: service_healthy}
      pc-runtime: {condition: service_healthy}
    restart: "no"
  web:
    image: process-copilot-workbench-demo-web:local
    build: {context: .., dockerfile: deploy/workbench-demo-web.Dockerfile}
    ports: [127.0.0.1:18091:80]
    networks: [control, browser]
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped
networks:
  control: {internal: true}
  model: {}
  browser: {}
volumes:
  ee-mysql-data:
  pc-postgres-data:
  pc-data:
  runtime-data:
  demo-bootstrap:
