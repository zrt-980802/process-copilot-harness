name: process-copilot-p1a-local

services:
  runtime-host:
    build:
      context: ..
      dockerfile: deploy/runtime-host.Dockerfile
      args:
        DSH_RUNTIME_BASE_IMAGE: ${DSH_RUNTIME_BASE_IMAGE:-process-copilot-p1a-local-dsh-runtime-base:0.2.1-rc.3}
    image: process-copilot-p1a-local-runtime-host:${PC_BUILD_TAG:-dev}
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PC_RUNTIME_ID: pc-runtime-p1a-local
      PC_RUNTIME_EPOCH: "1"
      DSH_PROVIDER: ${DSH_PROVIDER:-deepseek-official}
      DSH_MODEL: ${DSH_MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    volumes:
      - runtime-data:/var/lib/process-copilot
    networks:
      - runtime-internal
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

networks:
  runtime-internal:
    driver: bridge

volumes:
  runtime-data:
